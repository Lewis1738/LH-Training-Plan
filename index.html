<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><title>LH Training Log</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#15202b;--muted:#667382;--line:#e3e7eb;--accent:#1f6feb;--green:#18864b;--orange:#d97706;--nav:#0b1220}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{padding:18px 18px 12px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;color:#aeb8c5;font-size:13px}.view{display:none;padding:16px}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.section-title{font-weight:750;margin:8px 2px 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f7f9fb;border-radius:12px;padding:11px}.metric b{display:block;font-size:17px}.metric span{font-size:11px;color:var(--muted)}button,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6;color:var(--ink)}.danger{background:#fff0f0;color:#a11}.workout{display:flex;justify-content:space-between;gap:12px;align-items:center}.workout .title{font-weight:750}.workout .sub{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#edf1f5;white-space:nowrap}.done{background:#e8f6ef;color:var(--green)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);z-index:10}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;color:#aeb8c5;border-radius:0;padding:12px 4px;font-size:11px}.nav button.active{color:#fff;background:#182438}.nav .ico{display:block;font-size:18px;margin-bottom:2px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.tabs button.sel{background:var(--nav);color:#fff}.weekhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.day{font-weight:800;margin:18px 0 7px}.mini{font-size:12px;color:var(--muted)}.input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.range{width:100%}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.score{display:flex;align-items:center;gap:8px}.score output{font-weight:800;min-width:24px;text-align:center}.back{margin-bottom:10px}.hero{background:linear-gradient(135deg,#0b1220,#1d3557);color:#fff;border:0}.hero .muted{color:#c2cedb}.pillrow{display:flex;flex-wrap:wrap;gap:7px}.pill{background:#eef2f6;border-radius:999px;padding:7px 9px;font-size:12px}.listitem{padding:11px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.empty{text-align:center;padding:35px 15px;color:var(--muted)}
</style></head><body><div class="app"><header class="top"><h1>LH Training Log</h1><p id="topSub">Your training, your data.</p></header>
<main>
<section id="today" class="view active"></section><section id="plan" class="view"></section><section id="history" class="view"></section><section id="data" class="view"></section><section id="detail" class="view"></section>
</main></div><nav class="nav"><div class="navin"><button data-view="today"><span class="ico">🏠</span>Today</button><button data-view="plan"><span class="ico">📅</span>Plan</button><button data-view="history"><span class="ico">📚</span>History</button><button data-view="data"><span class="ico">📊</span>Data</button></div></nav>
<script src="app.js"></script></body></html>
