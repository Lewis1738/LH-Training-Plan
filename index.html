<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>LH Training Log</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#101827;--muted:#687386;--nav:#0b1020;--line:#e5e9f0;--accent:#4f7cff;--good:#21a366;--shadow:0 8px 24px rgba(16,24,39,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding-bottom:88px}.top{background:linear-gradient(145deg,#0b1020,#17213d);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px}
.brand{font-size:28px;font-weight:800;letter-spacing:-.5px}.subtitle{margin-top:4px;color:#aeb8ca;font-size:14px}
.container{max-width:720px;margin:0 auto;padding:16px}.page-title{font-size:25px;font-weight:800;margin:4px 0 3px}.page-sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.section-title{font-weight:800;font-size:17px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#f7f9fc;border-radius:13px;padding:11px}.metric label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.metric input{width:100%;border:0;background:transparent;font-size:20px;font-weight:750;padding:4px 0 0;outline:none}.metric .unit{color:var(--muted);font-size:11px}
.workout{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px;background:#fff}.workout.am{border-left:5px solid #6b8cff}.workout.pm{border-left:5px solid #9b72e6}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.workout h3{margin:4px 0 6px;font-size:17px}.workout p{margin:0;color:#4e596b;line-height:1.45;font-size:14px}
.pill{display:inline-block;background:#edf2ff;color:#315fd4;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750;margin-top:9px}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:750}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{background:#eef1f6;color:var(--ink)}.btn.full{width:100%;margin-top:12px}
.row{display:flex;gap:9px;align-items:center}.row.between{justify-content:space-between}.date-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.date-nav button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff}.datebox{flex:1;text-align:center}.datebox strong{display:block;font-size:18px}.datebox span{color:var(--muted);font-size:12px}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(11,16,32,.97);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.navbtn{border:0;background:transparent;color:#9fa9bd;padding:7px 3px;border-radius:12px;font-size:11px;font-weight:750}.navbtn.active{background:#202b49;color:#fff}.navicon{display:block;font-size:22px;line-height:24px;margin-bottom:2px}
.month{font-size:18px;font-weight:800;margin:18px 0 9px}.dayrow{display:flex;gap:10px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}.daynum{width:45px;text-align:center}.daynum strong{font-size:17px}.daynum small{display:block;color:var(--muted);font-size:10px}
.daycontent{flex:1;min-width:0}.daycontent strong{font-size:14px}.daycontent p{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.done{color:var(--good);font-size:20px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}.back{margin-bottom:12px}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:11px;resize:vertical;background:#fff}
select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.range{width:100%}.rangeval{font-weight:800;font-size:20px}
.field{margin:13px 0}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}.hidden{display:none!important}
.toast{position:fixed;z-index:50;left:16px;right:16px;bottom:95px;background:#101827;color:#fff;padding:13px 15px;border-radius:13px;text-align:center;font-size:13px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f9fc;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
.small{font-size:12px;color:var(--muted);line-height:1.45}@media(min-width:700px){.bottom{max-width:720px;left:50%;right:auto;transform:translateX(-50%);border-radius:18px 18px 0 0}}
.auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:28px 0}.auth-card{width:min(100%,460px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.auth-card h2{margin:0 0 8px}.auth-card .btn{margin-top:10px}.auth-card .field{margin-top:12px}.auth-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.auth-card .subtitle{color:var(--muted)}
</style>
</head>

const STORAGE = "lh_training_log_v2";
const todayISO = new Date().toISOString().slice(0,10);
let state = {recovery:{},workouts:{},nutrition:{},profile:{bmr:2168}};
let selectedDate = PLAN[todayISO] ? todayISO : Object.keys(PLAN).sort()[0];
let currentTab = "today", currentWorkout = null;
let currentUser = null;
let appReady = false;
let localState = null;

function saveState(){
  // Local cache only. The source of truth is Supabase.
  localStorage.setItem(STORAGE,JSON.stringify(state));
}
function loadLocalState(){
  try {
    const raw=localStorage.getItem(STORAGE);
    if(!raw) return null;
    const x=JSON.parse(raw);
    if(!x || typeof x!=="object") return null;
    x.recovery=x.recovery||{}; x.workouts=x.workouts||{}; x.nutrition=x.nutrition||{}; x.profile=x.profile||{};
    x.profile.bmr=x.profile.bmr||2168;
    return x;
  } catch(e){ return null; }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function prettyDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function shortDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),1800)}
function getDay(date){return PLAN[date]||{day:"",am:"No planned session",pm:"No planned session"}}
function sessionKey(date,slot){return date+"_"+slot}
function isComplete(date,slot){return !!state.workouts[sessionKey(date,slot)]?.saved}

function render(){
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
 if(currentWorkout)renderWorkout();else if(currentTab==="today")renderToday();else if(currentTab==="plan")renderPlan();else if(currentTab==="history")renderHistory();else if(currentTab==="data")renderData();else renderNutrition();
}
function metricInput(key,label,val,unit){
 const isSleep=key==="sleep";
 return `<div class="metric"><label>${label}</label><input id="rec_${key}" ${isSleep?'type="text" inputmode="numeric" placeholder="07:30" pattern="[0-9]{1,2}:[0-5][0-9]"':'inputmode="decimal"'} value="${esc(val||"")}"><span class="unit">${unit}</span></div>`
}
function isRestSession(session){
 const s=(session||'').toLowerCase();
 return s.includes('rest') || s.includes('recovery') || s.includes('no training') || s.includes('mobility');
}
function workoutCard(slot,session,type){
 const done=isComplete(selectedDate,slot);
 if(isRestSession(session)){

}
function mapWorkoutRow(x){
 return {saved:true,date:x.workout_date,slot:x.session_slot,session:x.planned_session||'',type:x.sport||'other',updatedAt:x.updated_at,notes:x.notes||'',preReadiness:x.readiness??'',preEnergy:x.pre_energy??'',preLegs:x.pre_legs??'',expectedFeel:x.expected_feel??'',distance:x.actual_distance??'',avgPace:x.avg_pace_seconds??'',avgHR:x.avg_heart_rate??'',maxHR:x.max_heart_rate??'',avgPower:x.avg_power??'',np:x.normalized_power??'',cadence:x.cadence??'',css:x.css_seconds_per_100m??'',swolf:x.swolf??'',strokeRate:x.stroke_rate??'',trainingEffect:x.training_effect??'',trainingLoad:x.training_load??'',elevation:x.elevation_gain??'',calories:x.calories_burned??'',temperature:x.temperature_c??'',rpe:x.rpe??'',postEnergy:x.post_energy??'',postLegs:x.post_legs??'',cardio:x.cardio_breathing??'',motivation:x.motivation??'',overallFeel:x.overall_feel??''};
}
function mapNutritionRow(x){
 const out={}; ['breakfast','lunch','dinner','snacks'].forEach(k=>out[k]={calories:x[k+'_calories']??0,protein:x[k+'_protein']??0,carbs:x[k+'_carbs']??0,fat:x[k+'_fat']??0}); return out;
}
async function migrateLocalData(user){
 const migratedKey='lh_cloud_migrated_'+user.id;
 if(localStorage.getItem(migratedKey)) return;
 const old=loadLocalState();
 if(old){
   const recs=Object.entries(old.recovery||{}).map(([date,r])=>{let mins=null;if(r.sleep&&String(r.sleep).includes(':')){const [h,m]=String(r.sleep).split(':').map(Number);if(Number.isFinite(h)&&Number.isFinite(m))mins=h*60+m;}return {user_id:user.id,recovery_date:date,sleep_minutes:mins,sleep_score:r.sleepScore?num(r.sleepScore):null,hrv:r.hrv?num(r.hrv):null,resting_heart_rate:r.rhr?num(r.rhr):null,body_battery:r.bodyBattery?num(r.bodyBattery):null,weight_kg:r.weight?num(r.weight):null};});
   if(recs.length) await sb.from('daily_recovery').upsert(recs,{onConflict:'user_id,recovery_date'});
   const ws=Object.values(old.workouts||{}).filter(x=>x.saved).map(x=>({user_id:user.id,workout_date:x.date,session_slot:String(x.slot).toUpperCase(),sport:x.type||'other',planned_session:x.session||'',planned_details:x.session||'',is_rest_day:false,readiness:x.preReadiness?num(x.preReadiness):null,pre_energy:x.preEnergy?num(x.preEnergy):null,pre_legs:x.preLegs?num(x.preLegs):null,expected_feel:x.expectedFeel?num(x.expectedFeel):null,completed:true,actual_distance:x.distance?num(x.distance):null,avg_heart_rate:x.avgHR?num(x.avgHR):null,max_heart_rate:x.maxHR?num(x.maxHR):null,training_effect:x.trainingEffect?num(x.trainingEffect):null,training_load:x.trainingLoad?num(x.trainingLoad):null,calories_burned:x.calories?num(x.calories):null,temperature_c:x.temperature?num(x.temperature):null,elevation_gain:x.elevation?num(x.elevation):null,avg_pace_seconds:x.avgPace?num(x.avgPace):null,cadence:x.cadence?num(x.cadence):null,avg_power:x.avgPower?num(x.avgPower):null,normalized_power:x.np?num(x.np):null,css_seconds_per_100m:x.css?num(x.css):null,swolf:x.swolf?num(x.swolf):null,stroke_rate:x.strokeRate?num(x.strokeRate):null,rpe:x.rpe?num(x.rpe):null,post_energy:x.postEnergy?num(x.postEnergy):null,post_legs:x.postLegs?num(x.postLegs):null,cardio_breathing:x.cardio?num(x.cardio):null,motivation:x.motivation?num(x.motivation):null,overall_feel:x.overallFeel?num(x.overallFeel):null,notes:x.notes||null}));
   if(ws.length) await sb.from('workouts').upsert(ws,{onConflict:'user_id,workout_date,session_slot'});
   const ns=Object.entries(old.nutrition||{}).map(([date,n])=>{const row={user_id:user.id,nutrition_date:date};['breakfast','lunch','dinner','snacks'].forEach(k=>{const m=n[k]||{};row[k+'_calories']=num(m.calories);row[k+'_protein']=num(m.protein);row[k+'_carbs']=num(m.carbs);row[k+'_fat']=num(m.fat);});return row;});
   if(ns.length) await sb.from('nutrition').upsert(ns,{onConflict:'user_id,nutrition_date'});
   if(old.profile?.bmr) await sb.from('profiles').upsert({id:user.id,bmr:num(old.profile.bmr),display_name:'Lewis'},{onConflict:'id'});
 }
 localStorage.setItem(migratedKey,'1');
}

async function loadCloudState(user){
 state={recovery:{},workouts:{},nutrition:{},profile:{bmr:2168}};
 const [p,r,w,n]=await Promise.all([
   sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),
   sb.from('daily_recovery').select('*').eq('user_id',user.id),
   sb.from('workouts').select('*').eq('user_id',user.id),
   sb.from('nutrition').select('*').eq('user_id',user.id)
 ]);
 for(const q of [p,r,w,n]) if(q.error) throw q.error;
 if(p.data) state.profile={bmr:p.data.bmr||2168,dailyTarget:p.data.daily_target||''};
 (r.data||[]).forEach(x=>state.recovery[x.recovery_date]=mapRecoveryRow(x));
 (w.data||[]).forEach(x=>state.workouts[sessionKey(x.workout_date,String(x.session_slot).toLowerCase())]=mapWorkoutRow(x));
 (n.data||[]).forEach(x=>state.nutrition[x.nutrition_date]=mapNutritionRow(x));
 saveState();
}

async function afterLogin(user){
 currentUser=user;
 try{
   const existing=await sb.from('profiles').select('id').eq('id',user.id).maybeSingle();
   if(existing.error) throw existing.error;
   if(!existing.data){
     const created=await sb.from('profiles').insert({id:user.id,display_name:(user.email||'Lewis').split('@')[0],bmr:2168});
     if(created.error) throw created.error;
   }
   await migrateLocalData(user);
   await loadCloudState(user);
   appReady=true;
   showAppShell();
   document.querySelector('.bottom').style.display='flex';
   render();
 }catch(e){console.error(e);currentUser=null;renderAuth('login','We could not load your training data. Please try again.');}
}

function showAppShell(){
 const userEmail=currentUser?.email||'';
 document.querySelector('.top').innerHTML=`<div class="brand">LH Training Log</div><div class="subtitle">Your training. Your data. <span style="opacity:.7">· ${esc(userEmail)}</span> <button class="btn secondary" style="float:right;padding:5px 9px;font-size:11px" onclick="signOut()">Log out</button></div>`;
}

async function boot(){
 document.querySelector('.bottom').style.display='none';
 renderAuth('login');
 const {data:{session}}=await sb.auth.getSession();
 if(session?.user) await afterLogin(session.user);
 sb.auth.onAuthStateChange(async(_event,session)=>{
   if(session?.user && !currentUser) await afterLogin(session.user);
 });
}

boot();
</script>
